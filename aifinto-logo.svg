<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4"/>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-light" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2"/>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <circle cx="100" cy="100" r="90" fill="#0f172a"/>
    <ellipse cx="100" cy="100" rx="55" ry="20" stroke="white" stroke-width="2" fill="none" opacity="0.55" filter="url(#glow-light)"/>
    <ellipse cx="100" cy="100" rx="55" ry="20" stroke="white" stroke-width="2" fill="none" transform="rotate(60 100 100)" opacity="0.55" filter="url(#glow-light)"/>
    <ellipse cx="100" cy="100" rx="55" ry="20" stroke="white" stroke-width="2" fill="none" transform="rotate(120 100 100)" opacity="0.55" filter="url(#glow-light)"/>
    <circle cx="100" cy="100" r="18" fill="#1e3a8a" filter="url(#glow)"/>
    <text x="100" y="106" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle" filter="url(#glow)">ai</text>
    <circle cx="155" cy="100" r="6" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="72" cy="148" r="6" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="72" cy="52" r="6" fill="#6366f1" filter="url(#glow)"/>
</svg>
