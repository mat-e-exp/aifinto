<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aifinto - AI Financial Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-logo">
                <object type="image/svg+xml" data="aifinto-logo-animated.svg" class="logo-small">
                    <img src="aifinto-logo.svg" alt="aifinto Logo" class="logo-small">
                </object>
            </div>
            <div class="header-text">
                <h1>Welcome to aifinto</h1>
                <p class="subtitle">AI Financial Tools</p>
            </div>
        </header>

        <main>
            <section class="tools-section">
                <h2>Currently Available Tools</h2>

                <div class="tool-card">
                    <div class="tool-logo">
                        <object type="image/svg+xml" data="ai-pulse-logo.svg" class="tool-logo-img">
                            <img src="ai-pulse-logo.svg" alt="AI Pulse Logo" class="tool-logo-img">
                        </object>
                    </div>
                    <div class="tool-info">
                        <h3>AI Pulse</h3>
                        <p class="tool-description">Daily AI sector intelligence briefings</p>
                        <div class="tool-actions">
                            <a href="https://ai-pulse.aifinto.com" class="btn btn-primary">Login</a>
                            <button type="button" class="btn btn-secondary" onclick="toggleSignup()">Request Access</button>
                        </div>
                        <div class="signup-form" id="signup-form">
                            <input type="email" id="email" placeholder="Enter your email" class="email-input">
                            <button type="button" class="btn btn-secondary" onclick="handleSignup()">Submit</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>More AI Financial Tools coming soon</p>
        </footer>
    </div>

    <script>
        function toggleSignup() {
            const form = document.getElementById('signup-form');
            form.classList.toggle('visible');
        }

        async function handleSignup() {
            const email = document.getElementById('email').value;
            const button = document.querySelector('.signup-form .btn');

            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }

            button.textContent = 'Sending...';
            button.disabled = true;

            try {
                const response = await fetch('https://formspree.io/f/xpqzzyjl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (response.ok) {
                    alert('Thanks for requesting access! We will be in touch soon.');
                    document.getElementById('email').value = '';
                    document.getElementById('signup-form').classList.remove('visible');
                } else {
                    alert('Something went wrong. Please try again.');
                }
            } catch (error) {
                alert('Something went wrong. Please try again.');
            }

            button.textContent = 'Submit';
            button.disabled = false;
        }
    </script>
</body>
</html>
